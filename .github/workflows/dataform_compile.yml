# Generate a representative Dataform project and compile it with Dataform CLI.
name: Dataform Compile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dataform-compile:
    name: Dataform compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Generate representative Dataform project
        run: |
          sql2sqlx tests/fixtures/dataform_compile \
            -o "${{ runner.temp }}/sql2sqlx-dataform/definitions" \
            --init-project \
            --default-project test-project \
            --default-dataset smoke \
            --insert-strategy incremental \
            --merge-strategy incremental-when-safe \
            --overwrite \
            --quiet
      - name: Compile generated SQLX
        run: >-
          npx --yes @dataform/cli@3.0.61 compile
          "${{ runner.temp }}/sql2sqlx-dataform"
