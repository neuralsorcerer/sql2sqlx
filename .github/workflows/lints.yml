# Run formatting, typing, and pre-commit checks.
name: Lints

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev toolchain
        run: python -m pip install -e ".[dev]"
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: mypy
        run: mypy
      - name: pre-commit
        run: pre-commit run --all-files
